<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>verrex — a guided tour</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --panel: #14171c;
        --border: #262b33;
        --text: #e6e8eb;
        --muted: #8a93a0;
        --accent: #7ee0c0;
        --accent-dim: #4fa98f;
        --code-bg: #0a0c0f;
      }
      * { box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2.5rem 1.5rem 4rem;
        max-width: 1040px;
        margin-inline: auto;
        line-height: 1.6;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.85em;
        background: var(--code-bg);
        border: 1px solid var(--border);
        padding: 0.05em 0.35em;
        border-radius: 4px;
        color: var(--accent);
      }
      pre code { border: none; padding: 0; background: none; }

      /* ─── Hero ─────────────────────────────────────────────── */
      .hero { margin-bottom: 3rem; }
      .eyebrow {
        text-transform: uppercase; letter-spacing: 0.18em;
        font-size: 0.72rem; color: var(--accent-dim); margin: 0 0 0.25rem;
      }
      .hero h1 { font-size: 3rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
      .tagline { font-size: 1.1rem; color: var(--text); max-width: 64ch; }
      .tagline code { font-size: 0.9em; }
      .how {
        margin-top: 1.75rem; padding: 1.25rem 1.5rem;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px;
      }
      .how h3 {
        margin: 0 0 0.5rem; font-size: 0.78rem; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--muted);
      }
      .how p { margin: 0.5rem 0 0; font-size: 0.95rem; color: #c6cbd2; max-width: 72ch; }
      .how-note { font-size: 0.88rem !important; color: var(--muted) !important; }

      /* ─── Tour section: copy left, live demo right ─────────── */
      .tour {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 1.5rem;
        align-items: start;
        padding: 1.75rem 0;
        border-top: 1px solid var(--border);
      }
      /* Single column on small screens. minmax(0, 1fr) — not plain 1fr,
         whose auto minimum lets the white-space:pre code blocks force the
         column (and the whole page) wider than the viewport. */
      @media (max-width: 820px) {
        .tour { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
      }
      .tour-head { display: flex; align-items: baseline; gap: 0.6rem; }
      .step {
        font-family: ui-monospace, monospace; font-size: 0.8rem;
        color: var(--accent-dim); border: 1px solid var(--border);
        border-radius: 5px; padding: 0.05rem 0.4rem;
      }
      .tour-copy h2 { font-size: 1.15rem; margin: 0; }
      .concept { color: #c6cbd2; font-size: 0.95rem; margin: 0.6rem 0 1rem; }
      .sig-label {
        text-transform: uppercase; letter-spacing: 0.08em;
        font-size: 0.66rem; color: var(--muted); margin: 0 0 0.25rem;
      }
      pre.sig, pre.code {
        background: var(--code-bg); border: 1px solid var(--border);
        border-radius: 8px; padding: 0.7rem 0.9rem; margin: 0 0 0.9rem;
        overflow-x: auto;
      }
      pre.sig { margin-bottom: 1rem; }
      pre.sig code {
        color: var(--accent); font-size: 0.82rem; white-space: pre;
      }
      pre.code code {
        color: #c5ccd6; font-size: 0.8rem; line-height: 1.55; white-space: pre;
      }
      /* Syntax tokens (from src/highlight.ts) */
      .tok-com   { color: #5f6b7a; font-style: italic; }
      .tok-str   { color: #9ece6a; }
      .tok-kw    { color: #c792ea; }
      .tok-num   { color: #f78c6c; }
      .tok-type  { color: #82d2c4; }
      .tok-fn    { color: #82aaff; }
      .tok-tag   { color: #f07178; }
      .tok-punct { color: #7f8c9a; }
      .tok-plain { color: #c5ccd6; }

      /* Fine-grained reactivity flash: src/flash.ts paints a transient overlay
         rectangle over the exact node that re-rendered (DevTools-style). */
      @keyframes verrex-flash-overlay {
        from {
          background-color: rgba(126, 224, 192, 0.32);
          box-shadow: 0 0 0 1px rgba(126, 224, 192, 0.6);
        }
        to {
          background-color: rgba(126, 224, 192, 0);
          box-shadow: 0 0 0 1px rgba(126, 224, 192, 0);
        }
      }
      .src {
        font-size: 0.82rem; color: var(--muted);
      }
      .src:hover { color: var(--accent); }

      /* ─── Live demo panel ──────────────────────────────────── */
      .tour-demo {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 0.7rem 1.25rem 1.25rem;
      }
      .demo-bar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 0.85rem; padding-bottom: 0.6rem;
        border-bottom: 1px solid var(--border);
      }
      .demo-label {
        font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--accent-dim); border: 1px solid var(--accent-dim);
        border-radius: 999px; padding: 0.05rem 0.5rem;
      }
      .demo-refresh {
        background: transparent; color: var(--muted); border: 1px solid var(--border);
        border-radius: 5px; padding: 0.12rem 0.55rem; font-size: 0.72rem;
        cursor: pointer; font-family: inherit;
      }
      .demo-refresh:hover { background: #1c2128; color: var(--accent); border-color: var(--accent-dim); }
      .demo-refresh:active { transform: translateY(1px); }

      .site-footer {
        margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
        color: var(--muted); font-size: 0.9rem;
      }

      /* ─── Component styles ─────────────────────────────────── */
      h3 { font-size: 0.95rem; margin: 0 0 0.5rem; }
      .counter button, .controls button {
        background: #1c2128; color: var(--text); border: 1px solid var(--border);
        padding: 0.25rem 0.75rem; border-radius: 5px; cursor: pointer;
      }
      .counter button:hover, .controls button:hover { background: #232932; }
      .counter .count, .remaining { font-variant-numeric: tabular-nums; }
      .user-page h1, .user-body h1, .async-user-page h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
      .user-page .bio, .user-body .bio, .user-card .bio { color: var(--muted); font-style: italic; }
      .posts { padding-inline-start: 1rem; margin: 0.5rem 0 0; }
      .empty { color: var(--muted); }
      .loading { color: var(--muted); }
      .error { color: #e08a8a; }
      .user-card strong { font-size: 1.05rem; }
      .live-user .controls { display: flex; gap: 0.5rem; margin: 0.5rem 0 1rem; flex-wrap: wrap; }
      .todos ul, .lifecycle ul { list-style: none; padding: 0; margin: 0.75rem 0 0; }
      .todos li { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
      .todos li.done .text { color: var(--muted); text-decoration: line-through; }
      .todos li .toggle, .todos li .remove {
        background: transparent; color: var(--muted); border: 1px solid var(--border);
        padding: 0 0.5rem; min-width: 1.6rem; border-radius: 5px; cursor: pointer;
      }
      .todos li .toggle:hover, .todos li .remove:hover { background: #1c2128; color: var(--text); }
      .todos li .text { flex: 1; }
      .todos .controls, .lifecycle .controls { display: flex; gap: 0.75rem; align-items: center; }
      .lifecycle li { padding: 0.2rem 0; }
      .lifecycle .hint { font-size: 0.82rem; color: var(--muted); margin-top: 0.75rem; }

      /* Catch error boundary (step 07): two boundaries stacked, each a fallback panel. */
      .catch-demo { display: flex; flex-direction: column; gap: 0.85rem; }
      .crasher p { margin: 0 0 0.5rem; }
      .catch-demo button {
        background: #1c2128; color: var(--text); border: 1px solid var(--border);
        padding: 0.25rem 0.75rem; border-radius: 5px; cursor: pointer; font-family: inherit;
      }
      .catch-demo button:hover { background: #232932; }
      .catch-demo button:active { transform: translateY(1px); }
      .catch-demo .crash { border-color: var(--accent-dim); color: var(--accent); }
      .catch-demo .ok { color: var(--accent); }
      .catch-demo .ok p { margin: 0 0 0.5rem; }
      .boundary-fallback {
        border: 1px solid #5a3a3a; background: rgba(224, 138, 138, 0.07);
        border-radius: 8px; padding: 0.7rem 0.9rem;
      }
      .boundary-fallback .caught {
        margin: 0 0 0.5rem; color: #e08a8a;
        font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
      }
      .boundary-fallback .cause {
        margin: 0 0 0.7rem; font-size: 0.75rem; color: var(--muted);
        white-space: pre-wrap; word-break: break-word; max-height: 8rem; overflow: auto;
      }

      /* Async failure homes (step 08): the leaf-handled fallback is deliberately
         softer than .boundary-fallback — content stays mounted, only the card
         swapped. */
      .async-escalate .controls { display: flex; gap: 0.5rem; margin: 0.5rem 0 1rem; flex-wrap: wrap; }
      .leaf-fallback {
        border: 1px dashed #5a4a3a; background: rgba(224, 178, 138, 0.06);
        border-radius: 8px; padding: 0.6rem 0.8rem;
      }
      .leaf-fallback .leaf-msg { margin: 0 0 0.5rem; color: #e0b28a; font-size: 0.85rem; }
      .boundary-fallback .rate-msg { margin: 0 0 0.7rem; font-size: 0.85rem; color: var(--muted); }
      .async-escalate .contrast-label { color: var(--muted); font-size: 0.82rem; margin: 1.1rem 0 0.4rem; }
      .async-escalate .budget-note { color: var(--muted); font-size: 0.72rem; align-self: center; }
      .async-escalate .req-log {
        font-size: 0.7rem; line-height: 1.5; color: var(--muted);
        background: #0f1318; border: 1px solid var(--border); border-radius: 6px;
        padding: 0.45rem 0.65rem; margin: 0 0 0.85rem; min-height: 5.6rem;
        white-space: pre; overflow-x: auto;
      }

      /* Stream clock (step 09): the hands carry only `transform: rotate(…)`
         inline (the reactive attr); everything else lives here. No CSS
         transition on the hands — each write is a discrete jump, so the flash
         overlay marks exactly the write, not an animation. */
      .aclock {
        position: relative; width: 170px; height: 170px; margin: 0.25rem auto;
        border: 2px solid var(--border); border-radius: 50%;
      }
      .aclock .mark { position: absolute; inset: 0; }
      .aclock .mark::before {
        content: ""; position: absolute; top: 6px; left: calc(50% - 1px);
        width: 2px; height: 7px; background: var(--border);
      }
      .aclock .hand {
        position: absolute; left: 50%; bottom: 50%;
        transform-origin: 50% 100%; border-radius: 3px;
      }
      .aclock .hour { width: 5px; height: 23%; margin-left: -2.5px; background: var(--text); }
      .aclock .minute { width: 3px; height: 33%; margin-left: -1.5px; background: var(--text); }
      .aclock .second { width: 1.5px; height: 38%; margin-left: -0.75px; background: var(--accent); }
      .aclock .pin {
        position: absolute; left: 50%; top: 50%; width: 9px; height: 9px;
        margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--accent);
      }

      /* ─── Small screens & touch ────────────────────────────── */
      /* No double-tap-to-zoom (the demo buttons invite rapid taps);
         pinch-zoom still works, unlike viewport user-scalable=no. */
      html { touch-action: manipulation; }
      @media (max-width: 480px) {
        body { padding: 1.5rem 1rem 3rem; }
        .hero h1 { font-size: 2.25rem; }
        .tagline { font-size: 1rem; }
        .how { padding: 1rem 1.1rem; }
        .tour-demo { padding-inline: 0.9rem; }
      }
      @media (pointer: coarse) {
        .counter button, .controls button, .catch-demo button,
        .boundary-fallback button, .leaf-fallback button {
          padding: 0.5rem 0.9rem;
        }
        .todos li .toggle, .todos li .remove {
          padding: 0.35rem 0.6rem; min-width: 2.2rem;
        }
        .demo-refresh { padding: 0.35rem 0.7rem; }
      }
    </style>
    <script type="module" crossorigin src="/verrex/pr-preview/pr-183/assets/index-ChaB5W41.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
